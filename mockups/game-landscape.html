<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #e9e7e2; font-family: Heebo, -apple-system, sans-serif; }
  body.device { background: #121417; overflow: hidden; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 16px 6px; font-size: 13px; color: #444; }
  .toolbar button { font: inherit; padding: 5px 12px; border-radius: 8px; border: 1px solid #b9b5ab; background: #fff; cursor: pointer; }
  .toolbar button.on { background: #222; color: #fff; border-color: #222; }
  .hint { padding: 0 16px 10px; font-size: 13px; color: #666; }
  body.device .toolbar, body.device .hint { display: none; }

  #stage { position: relative; margin: 0 16px; }
  #frame { position: absolute; top: 0; left: 0; width: 872px; height: 413px; border-radius: 56px; background: #0a0a0a; transform-origin: top left; }
  #screen { position: absolute; inset: 10px; border-radius: 48px; overflow: hidden; background: #121417; display: flex; flex-direction: row; align-items: flex-start; }
  body.device #stage { margin: 0; }
  body.device #frame { position: fixed; inset: 0; width: 100vw; height: 100vh; border-radius: 0; transform: none !important; }
  body.device #screen { inset: auto; top: 0; left: 0; width: 852px; height: 393px; border-radius: 0; }
  body.device .island, body.device .homebar { display: none; }

  .island { position: absolute; left: 12px; top: 50%; width: 34px; height: 120px; margin-top: -60px; border-radius: 20px; background: #000; }
  .homebar { position: absolute; bottom: 7px; left: 50%; width: 180px; height: 5px; margin-left: -90px; border-radius: 3px; background: #e9e9e9; opacity: .6; }

  :where(button.u) { all: unset; cursor: pointer; box-sizing: border-box; font-family: Heebo, sans-serif; text-align: center; }
  .sbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 84px; height: 54px; border-radius: 12px; background: #24272d; color: #e9e9e9; font-size: 14px; }
  .sbtn i { font-size: 20px; }
  .sbtn:active { transform: scale(.96); }
  .card { background: #1d2025; border-radius: 12px; padding: 8px 10px; color: #eee; }
  .pbtn { padding: 8px 14px; border-radius: 10px; font-size: 15px; }
  .chip { font-size: 12px; background: #2b2f36; border-radius: 6px; padding: 1px 6px; color: #cfd3d8; }
  .col-r { width: 150px; padding: 14px 46px 0 8px; display: flex; flex-direction: column; gap: 8px; color: #eee; }
  .col-l { width: 150px; padding: 14px 8px 0 46px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  body.device .col-r { padding-right: max(8px, env(safe-area-inset-right)); }
  body.device .col-l { padding-left: max(8px, env(safe-area-inset-left)); }
  #ov { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.55); align-items: center; justify-content: center; z-index: 5; }
  .msheet { width: 600px; height: 100%; background: #1a1d22; color: #eee; padding: 12px 16px 12px 56px; overflow-y: auto; animation: slin .2s ease-out; }
  @keyframes slin { from { transform: translateX(-100%); } to { transform: none; } }
  .msec { font-size: 11px; color: #8a9097; margin: 6px 0 2px; }
  .mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border-radius: 10px; font-size: 15px; color: #eee; text-align: right; }
  .mi:active, .mi:hover { background: #262a31; }
  .mi i { font-size: 19px; color: #b9bec5; }
  .mi .mt { display: flex; flex-direction: column; line-height: 1.25; }
  .mi small { font-size: 11px; color: #8a9097; }
  .bdg { margin-inline-start: auto; background: #5a3a12; color: #ffb648; font-size: 12px; font-weight: 500; border-radius: 9px; padding: 0 7px; }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .sw { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; cursor: pointer; }
  .sw.on { border-color: #ffd60a; }
  .seg { display: flex; background: #262a31; border-radius: 8px; padding: 2px; margin-inline-start: auto; }
  .seg button { padding: 3px 9px; border-radius: 6px; font-size: 12px; color: #cfd3d8; }
  .seg button.on { background: #3a3f48; color: #fff; }
  #demo { display: none; position: absolute; top: 162px; left: 14px; justify-content: flex-start; }
</style>
</head>
<body>
<div class="toolbar" dir="ltr">
  <span>Theme:</span>
  <button data-t="wood" class="on">Classic wood</button>
  <button data-t="inlay">Israeli inlay</button>

<div class="hint" dir="ltr">Try it: tap the stack on point 13 (top-left), drop on 10; tap 13 again, drop on 7; then tap סיימתי. Opened on an iPhone in landscape, the mockup fills the screen without the device frame.</div>

<div id="stage">
  <div id="frame">
    <div id="screen" dir="rtl">
      <div class="island"></div>
      <div class="homebar"></div>

      <div class="col-r">
        <div style="display:flex;align-items:center;gap:4px;font-size:14px;line-height:1.3">
          <span id="sname" contenteditable="true" style="outline:none;font-weight:500">אימון ערב</span>

        </div>

          <span>מצב אימון</span>
          <span id="sw" style="width:30px;height:17px;border-radius:9px;background:#2fb36b;position:relative"><span id="knob" style="position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s"></span></span>
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#b9bec5"><span id="mkB" style="width:12px;height:12px;border-radius:50%;display:inline-block"></span>המחשב</div>
          <div id="pipB" style="font-size:26px;font-weight:500;line-height:1.1">158</div>

        </div>
        <div class="card" style="outline:1.5px solid #ffd60a">
          <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#b9bec5"><span id="mkW" style="width:12px;height:12px;border-radius:50%;display:inline-block"></span>אתה</div>
          <div id="pipW" style="font-size:26px;font-weight:500;line-height:1.1">156</div>
          <div id="pipD" style="font-size:11px;color:#7fd6a0">+2 לטובתך</div>
        </div>

      <div id="bwrap" style="width:552px;height:364px;margin-top:8px;position:relative">
        <svg id="board" width="552" height="364" viewBox="0 0 552 364" style="display:block"></svg>
        <div id="demo">

            <button class="u pbtn" id="dAgain" style="background:#2b2f36;padding:4px 10px;font-size:13px;color:#fff">הצג שוב</button>

          </div>

      <div class="col-l">
        <button class="u sbtn" id="done" style="background:#2fb36b;color:#fff;height:64px;font-size:15px"><i class="ti ti-check"></i>סיימתי</button>
        <button class="u sbtn" id="undo"><i class="ti ti-arrow-back-up"></i>בטל מהלך</button>
        <button class="u sbtn" id="pause"><i class="ti ti-player-pause"></i>השהה</button>
        <button class="u sbtn" id="stop"><i class="ti ti-player-stop"></i>עצור</button>

      <div id="ov"></div>

<script>
const TH = {
  wood:   { frame:'#5b3a1e', bed:'#d9b98a', pA:'#7a2418', pB:'#f3e6c8', w:'#f6f0e2', ws:'#a89a7c', b:'#2b211b', bs:'#000',    die:'#ffffff', pip:'#111',    tray:'#4a2f17' },
  inlay:  { frame:'#3d2a17', bed:'#b98d5e', pA:'#2e5e4e', pB:'#ece2c9', w:'#efe6d2', ws:'#9c8a68', b:'#6b2b1a', bs:'#3a160c', die:'#f2e8d0', pip:'#3d2a17', tray:'#2c1e10' },
  felt:   { frame:'#3b2a20', bed:'#1f5d3a', pA:'#b8312f', pB:'#e9e4d4', w:'#f5f5f0', ws:'#9a9a90', b:'#1c1c1c', bs:'#000',    die:'#c0392b', pip:'#ffffff', tray:'#2a1d15' },
  marble: { frame:'#b8a06a', bed:'#f2efe9', pA:'#2a2a2a', pB:'#c9b37e', w:'#ffffff', ws:'#b8a06a', b:'#1b1b1b', bs:'#b8a06a', die:'#ffffff', pip:'#8a6d2f', tray:'#a38c58' },
  dark:   { frame:'#0d0e10', bed:'#1d1f24', pA:'#00c2a8', pB:'#3a3f4b', w:'#e8e8e8', ws:'#9aa0a6', b:'#ff4d6d', bs:'#a3243d', die:'#2b2f36', pip:'#00e0c2', tray:'#16181c' }
};
let th = 'wood';

const W = 552, H = 364, F = 10, TR = 32, BAR = 28, HALF = (W - 2*F - TR - BAR) / 2, PW = HALF / 6, R = 16.5, PH = 138;
const RX = F + HALF + BAR, BX = F + HALF, TX = RX + HALF;
const START = { w: {6:4, 8:3, 13:4, 24:2, 4:2}, b: {1:2, 12:4, 17:3, 19:4, 20:2}, bbar: 0 };
const BEST = [{f:13, t:4}], MINE = [{f:13, t:10}, {f:13, t:7}];
let pos, used, sel, moves, mode, trainOn = true, after, demoMine = false;

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));

function reset() {
  pos = clone(START); used = []; sel = null; moves = []; mode = 'play';
  closeOv(); $('demo').style.display = 'none'; draw();
}

function px(p) {
  if (p <= 6)  return RX + HALF - (p - .5) * PW;
  if (p <= 12) return F + HALF - (p - 6.5) * PW;
  if (p <= 18) return F + (p - 12.5) * PW;
  return RX + (p - 18.5) * PW;
}
const isTop = p => p >= 13;
function cy(p, k, n) {
  const sp = n <= 4 ? 2*R : (PH - 2*R) / (n - 1);
  return isTop(p) ? F + R + k*sp : H - F - R - k*sp;
}
function rem() {
  const r = [6, 3];
  used.forEach(u => { const i = r.indexOf(u); if (i >= 0) r.splice(i, 1); });
  return r;
}
const open = t => t >= 1 && (pos.b[t] || 0) < 2;
function dests(p) {
  const r = rem(), out = [];
  r.forEach(d => { if (open(p - d)) out.push({ t: p - d, dice: [d], l: '' + d }); });
  if (r.length === 2) {
    const [a, b] = r, t = p - a - b;
    if (open(t) && (open(p - a) || open(p - b))) out.push({ t, dice: [a, b], l: a + '+' + b });
  }
  return out;
}
function pips() {
  let w = 0, b = pos.bbar * 25;
  for (const p in pos.w) w += p * pos.w[p];
  for (const p in pos.b) b += (25 - p) * pos.b[p];
  return [w, b];
}

function checker(x, y, c, stroke) {
  return `<circle cx="${x}" cy="${y}" r="${R-1}" fill="${c}" stroke="${stroke}" stroke-width="1.5"/>` +
         `<circle cx="${x}" cy="${y}" r="${R-6}" fill="none" stroke="${stroke}" stroke-opacity=".35" stroke-width="1"/>`;
}
function die(x, y, v, fade) {
  const T = TH[th], s = 34;
  const o = {1:[[.5,.5]], 2:[[.27,.27],[.73,.73]], 3:[[.25,.25],[.5,.5],[.75,.75]],
             4:[[.27,.27],[.73,.27],[.27,.73],[.73,.73]], 5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],
             6:[[.27,.22],[.73,.22],[.27,.5],[.73,.5],[.27,.78],[.73,.78]]}[v];
  return `<g opacity="${fade ? .3 : 1}"><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="7" fill="${T.die}" stroke="rgba(0,0,0,.35)"/>` +
         o.map(q => `<circle cx="${x + q[0]*s}" cy="${y + q[1]*s}" r="3.3" fill="${T.pip}"/>`).join('') + `</g>`;
}

function draw(ghosts) {
  const T = TH[th];
  let s = `<rect width="${W}" height="${H}" rx="10" fill="${T.frame}"/>` +
    `<rect x="${F}" y="${F}" width="${HALF}" height="${H-2*F}" fill="${T.bed}"/>` +
    `<rect x="${RX}" y="${F}" width="${HALF}" height="${H-2*F}" fill="${T.bed}"/>` +
    `<rect x="${BX}" y="${F}" width="${BAR}" height="${H-2*F}" fill="${T.frame}"/>` +
    `<rect x="${TX+3}" y="${F}" width="${TR-6}" height="${(H-2*F)/2-6}" rx="4" fill="${T.tray}"/>` +
    `<rect x="${TX+3}" y="${H/2+6}" width="${TR-6}" height="${(H-2*F)/2-6}" rx="4" fill="${T.tray}"/>`;

  const ds = (mode === 'play' && sel) ? dests(sel) : [];
  for (let p = 1; p <= 24; p++) {
    const x = px(p), t = isTop(p), by = t ? F : H - F, ty = t ? F + PH : H - F - PH;
    const tri = `points="${x-PW/2+1},${by} ${x+PW/2-1},${by} ${x},${ty}"`;
    s += `<polygon ${tri} fill="${p % 2 ? T.pA : T.pB}"/>`;
    s += `<text x="${x}" y="${t ? 8.5 : H-2}" font-size="8" text-anchor="middle" fill="rgba(255,255,255,.55)" font-family="Heebo">${p}</text>`;
    if (ds.find(d => d.t === p)) s += `<polygon ${tri} fill="#ffd60a" fill-opacity=".38"/>`;
  }
  for (let p = 1; p <= 24; p++) {
    const x = px(p);
    [['w', T.w, T.ws], ['b', T.b, T.bs]].forEach(([k, c, st]) => {
      const n = pos[k][p] || 0;
      for (let i = 0; i < n; i++) {
        s += checker(x, cy(p, i, n), c, st);
        if (k === 'w' && sel === p && i === n - 1 && mode === 'play')
          s += `<circle cx="${x}" cy="${cy(p, i, n)}" r="${R+1.5}" fill="none" stroke="#ffd60a" stroke-width="3"/>`;
      }
      if (n > 5) s += `<text x="${x}" y="${cy(p, n-1, n) + 4}" font-size="12" text-anchor="middle" fill="${k === 'w' ? '#333' : '#fff'}" font-family="Heebo">${n}</text>`;
    });
  }
  for (let i = 0; i < pos.bbar; i++) s += checker(BX + BAR/2, H/2 - R - 8 - i*2*R, T.b, T.bs);

  ds.forEach(d => {
    const n = pos.w[d.t] || 0, x = px(d.t), y = cy(d.t, Math.min(n, 4), Math.max(n + 1, 1));
    s += `<circle cx="${x}" cy="${y}" r="${R-1}" fill="#ffd60a" fill-opacity=".25" stroke="#ffd60a" stroke-width="2" stroke-dasharray="4 3"/>` +
         `<text x="${x}" y="${y+5}" font-size="13" text-anchor="middle" fill="#3a2f00" font-family="Heebo" font-weight="500">${d.l}</text>`;
  });

  if (mode === 'play' || mode === 'demo') {
    const r = rem();
    s += die(RX + HALF/2 - 40, H/2 - 17, 6, !r.includes(6) && mode === 'play') +
         die(RX + HALF/2 + 6,  H/2 - 17, 3, !r.includes(3) && mode === 'play');
  }
  if (mode === 'bot')
    s += `<rect x="${F+HALF/2-70}" y="${H/2-16}" width="140" height="32" rx="16" fill="rgba(0,0,0,.6)"/>` +
         `<text x="${F+HALF/2}" y="${H/2+5}" font-size="14" text-anchor="middle" fill="#fff" font-family="Heebo">המחשב חושב…</text>`;

  if (ghosts) ghosts.forEach((g, i) => {
    const x0 = px(g.f), y0 = cy(g.f, (START.w[g.f] || 1) - 1 - i, START.w[g.f]);
    const n = pos.w[g.t] || 0, x1 = px(g.t), y1 = cy(g.t, n + i, Math.max(n + 1 + i, 1));
    s += `<path d="M${x0},${y0} Q${(x0+x1)/2},${H/2} ${x1},${y1}" fill="none" stroke="#ffd60a" stroke-width="2.5" stroke-dasharray="6 4"/>` +
         `<g class="gh" style="transition:transform 1s ease-in-out;transform:translate(${x0}px,${y0}px)" data-x="${x1}" data-y="${y1}">` +
         `<circle r="${R-1}" fill="${T.w}" fill-opacity=".55" stroke="#ffd60a" stroke-width="2" stroke-dasharray="4 3"/></g>`;
  });

  for (let p = 1; p <= 24; p++) {
    const x = px(p), t = isTop(p);
    s += `<rect data-p="${p}" x="${x-PW/2}" y="${t ? F : H/2}" width="${PW}" height="${H/2-F}" fill="transparent" style="cursor:pointer"/>`;
  }

  const svg = $('board');
  svg.innerHTML = s;
  if (ghosts) requestAnimationFrame(() => requestAnimationFrame(() =>
    svg.querySelectorAll('.gh').forEach(g => g.style.transform = `translate(${g.dataset.x}px,${g.dataset.y}px)`)));

  const [pw, pb] = pips(), d = pb - pw;
  $('pipW').textContent = pw; $('pipB').textContent = pb;
  $('pipD').textContent = d >= 0 ? `+${d} לטובתך` : `${d} לטובת המחשב`;
  $('pipD').style.color = d >= 0 ? '#7fd6a0' : '#ff8a8a';
  $('mkW').style.background = T.w; $('mkB').style.background = T.b;
}

$('board').addEventListener('click', ev => {
  const p = +ev.target.dataset.p;
  if (!p || mode !== 'play') return;
  if (sel) {
    const d = dests(sel).find(x => x.t === p);
    if (d) {
      pos.w[sel]--; if (!pos.w[sel]) delete pos.w[sel];
      if (pos.b[p] === 1) { delete pos.b[p]; pos.bbar++; }
      pos.w[p] = (pos.w[p] || 0) + 1;
      used.push(...d.dice); moves.push([sel, p]); sel = null; draw();
      return;
    }
  }
  sel = (pos.w[p] && rem().length) ? (sel === p ? null : p) : null;
  draw();
});

function ovShow(h) { $('ov').innerHTML = h; $('ov').style.display = 'flex'; }
function closeOv() { $('ov').style.display = 'none'; }

const POPUP = `<div dir="rtl" style="width:500px;background:#1d2025;border-radius:16px;padding:14px 18px;color:#eee">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <span style="background:#5a3a12;color:#ffb648;border-radius:8px;padding:2px 10px;font-size:15px;font-weight:500">טעות</span>
    <span style="display:flex;gap:3px"><i style="width:18px;height:6px;border-radius:3px;background:#ffb648;display:block"></i><i style="width:18px;height:6px;border-radius:3px;background:#ffb648;display:block"></i><i style="width:18px;height:6px;border-radius:3px;background:#444;display:block"></i></span>
    <span style="font-size:12px;color:#9aa0a6">רמה 2 מתוך 3</span>
    <span style="margin-inline-start:auto;font-size:13px;color:#ff8a8a">הפסד אקוויטי: 0.074</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
    <div style="background:#2a1c1c;border-radius:10px;padding:6px 10px"><div style="font-size:12px;color:#ff9a9a">המהלך שלך</div><div style="font-size:16px;font-weight:500;direction:ltr;text-align:right">13/10 13/7</div><div style="font-size:12px;color:#b9bec5">ניצחון 49.6% · מארס 11.2%</div></div>
    <div style="background:#16291f;border-radius:10px;padding:6px 10px"><div style="font-size:12px;color:#7fd6a0">המהלך הטוב ביותר</div><div style="font-size:16px;font-weight:500;direction:ltr;text-align:right">13/4</div><div style="font-size:12px;color:#b9bec5">ניצחון 53.9% · מארס 12.0%</div></div>
  </div>
  <ul style="margin:0 0 10px;padding-inline-start:18px;font-size:14px;line-height:1.5;color:#dfe2e6">
    <li>השארת שני חיילים בודדים (בנקודות 7 ו-10) בטווח של שני החיילים האחוריים של היריב.</li>
    <li>סיכוי להיפגע: 18 מתוך 36 הטלות (50%), לעומת 0% במהלך המומלץ.</li>
    <li>13/4 שומר על כל החיילים מוגנים ומוסיף בונה לבית – אין סיבה לקחת סיכון בעמדה שווה.</li>
  </ul>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="u pbtn" id="pDemo" style="background:#2f7de1;color:#fff"><i class="ti ti-player-play"></i> הדגם על הלוח</button>
    <button class="u pbtn" id="pCont" style="background:#2b2f36;color:#eee">המשך</button>
    <span style="font-size:12px;color:#9aa0a6;margin-inline-start:auto">המהלך שלך נשאר על הלוח</span>
  </div>
</div>`;

function botTurn() { mode = 'bot'; sel = null; draw(); }
const isMove = a => moves.map(x => x.join('/')).sort().join(' ') === a;

$('done').onclick = () => {
  if (mode !== 'play') return;
  if (rem().length) {
    $('done').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration: 250});
    return;
  }
  if (isMove('13/10 13/7') && trainOn) {
    ovShow(POPUP);
    $('pDemo').onclick = startDemo;
    $('pCont').onclick = () => { closeOv(); botTurn(); };
  } else {
    botTurn();
  }
};

function startDemo() {
  closeOv(); after = clone(pos); pos = clone(START); mode = 'demo'; demoMine = false;
  $('demo').style.display = 'flex'; runDemo();
}
function runDemo() {
  $('demoT').textContent = demoMine ? 'שלך: 13/10 13/7' : 'מומלץ: 13/4';
  $('dMine').textContent = demoMine ? 'המומלץ' : 'שלי';
  draw(demoMine ? MINE : BEST);
}
$('dAgain').onclick = runDemo;
$('dMine').onclick = () => { demoMine = !demoMine; runDemo(); };
$('dOk').onclick = () => { $('demo').style.display = 'none'; pos = after; botTurn(); };

$('undo').onclick = () => { if (mode !== 'play') return; pos = clone(START); used = []; moves = []; sel = null; draw(); };

$('pause').onclick = () => {
  ovShow(`<div dir="rtl" style="text-align:center;color:#fff"><i class="ti ti-player-pause" style="font-size:40px"></i><div style="font-size:20px;margin:6px 0 12px">המשחק מושהה</div><button class="u pbtn" id="res" style="background:#2fb36b;color:#fff">המשך משחק</button></div>`);
  $('res').onclick = closeOv;
};
$('stop').onclick = () => {
  ovShow(`<div dir="rtl" style="width:380px;background:#1d2025;border-radius:16px;padding:16px 18px;color:#eee"><div style="font-size:17px;font-weight:500;margin-bottom:4px">לעצור את המשחק?</div><div style="font-size:14px;color:#b9bec5;margin-bottom:12px">המשחק יישמר בהיסטוריה בסטטוס "הופסק" ולא ייספר בסטטיסטיקה.</div><div style="display:flex;gap:8px"><button class="u pbtn" id="stY" style="background:#c0392b;color:#fff">עצור</button><button class="u pbtn" id="stN" style="background:#2b2f36;color:#eee">ביטול</button></div></div>`);
  $('stY').onclick = closeOv; $('stN').onclick = closeOv;
};

$('trn').onclick = () => {
  trainOn = !trainOn;
  $('sw').style.background = trainOn ? '#2fb36b' : '#555';
  $('knob').style.left = trainOn ? '2px' : '15px';
};

document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
  th = b.dataset.t;
  document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b));
  draw(mode === 'demo' ? (demoMine ? MINE : BEST) : null);
});
$('reset').onclick = reset;

let sound = true, speed = 'רגיל';
const SW = { wood: ['#5b3a1e', '#d9b98a'], inlay: ['#3d2a17', '#2e5e4e'], felt: ['#3b2a20', '#1f5d3a'], marble: ['#b8a06a', '#f2efe9'], dark: ['#0d0e10', '#00c2a8'] };
function menuHtml() {
  const mi = (id, icon, label, note, badge) => `<button class="u mi" data-m="${id}"><i class="ti ti-${icon}"></i><span class="mt">${label}${note ? `<small>${note}</small>` : ''}</span>${badge ? `<b class="bdg">${badge}</b>` : ''}</button>`;
  return `<div class="msheet" dir="rtl" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;margin-bottom:2px"><span style="font-size:17px;font-weight:500">תפריט</span>
      <button class="u" id="mClose" style="margin-inline-start:auto;font-size:20px;color:#b9bec5"><i class="ti ti-x"></i></button></div>
    <div class="mgrid"><div>
    <div class="msec">המשחק הנוכחי</div>
    ${mi('new', 'plus', 'משחק חדש', 'הנוכחי יישמר כמושהה')}
    ${mi('rename', 'pencil', 'שינוי שם המשחק')}
    ${mi('info', 'info-circle', 'פרטי המשחק', 'רמה, שעת התחלה, מהלכים')}
    ${mi('mistakes', 'alert-triangle', 'הטעויות שלי במשחק', 'צפייה בכל הטעויות עד כה', '2')}
    <div class="msec">ניווט</div>
    ${mi('home', 'home', 'מסך הבית')}
    ${mi('history', 'history', 'היסטוריית משחקים')}
    ${mi('stats', 'chart-bar', 'סטטיסטיקה')}
    </div><div>
    <div class="msec">תצוגה מהירה</div>
    <div class="mi" style="cursor:default"><i class="ti ti-palette"></i><span class="mt">ערכת עיצוב</span></div>
    <div style="display:flex;gap:6px;padding:0 37px 6px 0">${Object.keys(SW).map(k => `<span class="sw${k === th ? ' on' : ''}" data-sw="${k}" style="background:linear-gradient(135deg,${SW[k][0]} 50%,${SW[k][1]} 50%)"></span>`).join('')}</div>
    <div class="mi" style="cursor:default"><i class="ti ti-volume"></i><span class="mt">צלילים</span></div>
    <div style="display:flex;padding:0 37px 6px 0"><div class="seg" style="margin:0"><button class="u ${sound ? 'on' : ''}" data-snd="1">פועל</button><button class="u ${sound ? '' : 'on'}" data-snd="0">כבוי</button></div></div>
    <div class="mi" style="cursor:default"><i class="ti ti-gauge"></i><span class="mt">מהירות המחשב</span></div>
    <div style="display:flex;padding:0 37px 6px 0"><div class="seg" style="margin:0">${['איטי', 'רגיל', 'מהיר'].map(v => `<button class="u ${v === speed ? 'on' : ''}" data-spd="${v}">${v}</button>`).join('')}</div></div>
    <div class="msec">עוד</div>
    ${mi('settings', 'settings', 'הגדרות', 'כיוון לוח, ספי טעויות, גיבוי')}
    ${mi('help', 'help-circle', 'חוקי המשחק ועזרה')}
    </div></div>
    <div id="mNote" style="display:none;margin-top:8px;font-size:12px;color:#ffd60a"></div>
  </div>`;
}
function openMenu() {
  if (mode === 'demo') return;
  const o = $('ov');
  o.style.justifyContent = 'flex-end'; o.style.alignItems = 'stretch';
  ovShow(menuHtml());
  o.onclick = closeMenu;
  $('mClose').onclick = closeMenu;
  o.querySelectorAll('[data-sw]').forEach(s => s.onclick = () => { document.querySelector(`.toolbar [data-t="${s.dataset.sw}"]`).click(); openMenu(); });
  o.querySelectorAll('[data-snd]').forEach(b => b.onclick = () => { sound = b.dataset.snd === '1'; openMenu(); });
  o.querySelectorAll('[data-spd]').forEach(b => b.onclick = () => { speed = b.dataset.spd; openMenu(); });
  o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    if (b.dataset.m === 'rename') { closeMenu(); const n = $('sname'); n.focus(); document.getSelection().selectAllChildren(n); return; }
    const note = $('mNote'); note.style.display = 'block'; note.textContent = `"${b.querySelector(".mt").firstChild.textContent.trim()}" – המסך הזה יעוצב בשלב הבא של הסקירה`;
  });
  o.querySelector('.msheet').style.animation = o.dataset.open ? 'none' : '';
  o.dataset.open = '1';
}
function closeMenu() {
  const o = $('ov');
  closeOv(); o.onclick = null; delete o.dataset.open;
  o.style.justifyContent = ''; o.style.alignItems = '';
}
$('menu').onclick = openMenu;

const isPhoneLandscape = () => matchMedia('(pointer: coarse) and (orientation: landscape) and (max-height: 500px)').matches;
function fit() {
  if (isPhoneLandscape()) {
    document.body.classList.add('device');
    const s = Math.min(innerWidth / 852, innerHeight / 393);
    $('screen').style.left = Math.max(0, (innerWidth - 852 * s) / 2) + 'px';
    $('screen').style.transform = s < 1 ? `scale(${s})` : '';
    $('screen').style.transformOrigin = 'top left';
    return;
  }
  document.body.classList.remove('device');
  $('screen').style.transform = ''; $('screen').style.left = '';
  const st = $('stage'), s = Math.min(1, st.clientWidth / 872);
  $('frame').style.transform = `scale(${s})`;
  st.style.height = (413 * s + 16) + 'px';
}
addEventListener('resize', fit);
fit(); reset();
</script>
</body>
</html>
